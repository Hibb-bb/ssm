# Stage A — curriculum phase 2 (MAIN).
#
# Loads weights from phase-1 best ckpt via --init_from (fresh optimizer
# + LR schedule, weights only).  See stage_a_curriculum_easy.yaml for
# the rationale and source-mix details.
#
# Curriculum schedule:
#   Phase 1 (steps 0-10K):   regime [0.50, 0.15, 0.25, 0.10]  (easy)
#   Phase 2 (this, 10K-40K): regime [0.30, 0.15, 0.35, 0.20]  (main)

stage:
  per_var_min_length: 64
  per_var_max_length: 256
  max_variates: 20
  variate_count_dist:    [0.10, 0.60, 0.25, 0.05]
  context_fraction:      [0.5, 0.95]
  tail_prediction_prob:  0.05
  tail_prediction_range: [0.92, 0.98]
  task_type_probs: [0.20, 0.50, 0.30]
  # CURRICULUM PHASE 2: main regime mix, more mixed/async
  regime_dist:     [0.30, 0.15, 0.35, 0.20]
  min_ctx_obs_per_target: 8
  min_pred_obs_per_target: 1
  min_ctx_obs_per_aux: 1
  clean_target_mode: true

mix:
  chronos2_synth: 0.70
  kernelsynth:    0.30

overrides:
  chronos2_synth:
    regime_dist: [0.30, 0.15, 0.35, 0.20]
    task_type_probs: [0.10, 0.65, 0.25]
  kernelsynth:
    regime_dist: [0.30, 0.15, 0.35, 0.20]
    task_type_probs: [0.20, 0.55, 0.25]
