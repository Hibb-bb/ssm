experiment: low-dimensional
model: NCDSSMNL
dataset: sine
exp_root_dir: ./results/{model}/{dataset}/{timestamp}/
train_batch_size: 50
test_batch_size: 50
learning_rate: 1.e-2
lr_decay_rate: 0.9
lr_decay_steps: 500
train_missing_p: 0.2
ssm_params_warmup_steps: 0
max_grad_norm: 100.0
num_steps: 5000
log_steps: 500
save_steps: 500
device: cpu  # Which device to use, e.g., cpu, cuda:0, cuda:1, ...

z_dim: 6
y_dim: 1
u_dim: 0
aux_dim: 1

inference_trainable_cov: true
drift_mlp_units: 64
drift_hidden_layers: 1
drift_nonlinearity: softplus
drift_last_nonlinearity: false
drift_zero_init_last: false
drift_spectral_norm: false
fixed_H: true

num_forecast: 50
num_plots: 2
num_train_plots: 2

dt: 0.1
ctx_len: 100
pred_len: 200
train_num_series: 1024
val_num_series: 256
test_num_series: 256
sine_train_seed: 0
sine_val_seed: 1
sine_test_seed: 2

integration_step_size: 0.05
integration_method: rk4

